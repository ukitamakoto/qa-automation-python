name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest tests/api tests/sql tests/meta --html=report/api.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-api
          path: report/

  postman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          npx --yes -p newman@6.2.1 -p newman-reporter-htmlextra@1.23.1
          newman run postman/restful-booker.postman_collection.json
          -r cli,htmlextra --reporter-htmlextra-export report/postman.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-postman
          path: report/

  ui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps ${{ matrix.browser }}
      - run: >
          uv run pytest tests/ui --browser ${{ matrix.browser }}
          --tracing retain-on-failure --screenshot only-on-failure --output test-results
          --html=report/ui-${{ matrix.browser }}.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-ui-${{ matrix.browser }}
          path: report/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: traces-${{ matrix.browser }}
          path: test-results/

  pages:
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [api, postman, ui]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: true
          path: site
      - name: Index page
        run: |
          cat > site/index.html <<EOF
          <!doctype html><html lang="en"><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>qa-automation-python · test reports</title>
          <style>body{font:16px/1.5 system-ui,sans-serif;max-width:42rem;margin:3rem auto;padding:0 1rem}li{margin:.4rem 0}</style>
          <h1>qa-automation-python · latest test reports</h1>
          <p>Commit <code>${GITHUB_SHA::7}</code> · run <a href="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}">#${GITHUB_RUN_NUMBER}</a> · $(date -u '+%Y-%m-%d %H:%M UTC')</p>
          <ul>
            <li><a href="api.html">API tests (Restful-Booker) and SQL migration checks</a></li>
            <li><a href="postman.html">Postman collection run with Newman: Restful-Booker</a></li>
            <li><a href="ui-chromium.html">UI tests in Chromium: SauceDemo</a></li>
            <li><a href="ui-firefox.html">UI tests in Firefox: SauceDemo</a></li>
          </ul>
          <p>Expected failures (xfail) are known defects. Each one has a report in
          <a href="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/main/docs/bugs">docs/bugs</a>.</p>
          </html>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
